name: sahabi_guide
description: Compagnon de pèlerinage intelligent pour le Hajj avec suivi GPS en temps réel, guide des rituels et système d'alertes.
publish_to: "none"

version: 1.2.15+125

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^12.1.3

  # HTTP Client
  dio: ^5.4.0

  # Dependency Injection
  get_it: ^7.6.4

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  connectivity_plus: ^6.1.5

  # Local Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Audio Player
  just_audio: ^0.9.36
  # Session audio globale iOS/Android (categorie playback) — indispensable
  # pour que flutter_tts + just_audio sortent du son en mode sonnerie.
  audio_session: ^0.1.25

  # Video Player (pour splash screen animé)
  video_player: ^2.8.0
  # chewie: ^1.7.0  # ❌ SUPPRIMÉ - Non utilisé
  # youtube_player_flutter retiré : la dep transitive flutter_inappwebview
  # requiert AGP 8.0.1 depuis dl.google.com et déclenche un SSL handshake
  # error sur cet environnement. Lecture YouTube via launchUrl externe.

  # Maps & Location
  # flutter_map remplacé par google_maps_flutter
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  battery_plus: ^6.0.2

  # Prayer times calculation (Islamic prayer times based on geo coordinates)
  adhan: ^2.0.0

  # Localization
  intl: ^0.20.2
  flutter_localized_locales: ^2.0.5

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # UI & Fonts
  google_fonts: ^6.1.0

  # QR Code & Sharing
  # qr_flutter: ^4.1.0     # ❌ SUPPRIMÉ - Non utilisé
  # share_plus: ^10.0.3    # ❌ SUPPRIMÉ - Non utilisé

  # Utilities
  uuid: ^4.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  logger: ^2.0.2+1
  # cached_network_image: ^3.4.1  # ❌ SUPPRIMÉ - Non utilisé
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5

  # Voix (STT/TTS) pour le copilote en haoussa et francais
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0

  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  
  # Générateur d'icônes
  flutter_launcher_icons: ^0.13.1
  
  # Générateur de splash screen
  flutter_native_splash: ^2.4.1

flutter:
  generate: true

  # Add the following information
  # to generate the required files for localization
  # The files will be generated in the .dart_tool/flutter_gen/gen_l10n directory
  # when you run `flutter gen-l10n`
  #
  # To regenerate the files, run `flutter gen-l10n`
  #
  # For more information, see:
  # https://flutter.dev/go/i18n-user-guide
  #
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/video/
    - assets/favicon/
    - assets/google_fonts/
    # - assets/audio/   # désactivé: dossier manquant
    # - assets/icons/   # désactivé: dossier manquant

# ============================================
# CONFIGURATION DES ICÔNES
# ============================================
flutter_launcher_icons:
  android: true
  ios: true
  # Icône carrée 1024x1024, fond beige plein, pin centré agrandi
  image_path: "assets/icon/app_icon.png"

  # Configuration Android - Adaptive Icon
  adaptive_icon_background: "#FEFDFB"  # Fond beige
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  # Configuration iOS
  remove_alpha_ios: true  # Supprime l'alpha — exigé par Apple (sinon rejet)
  

# ============================================
# CONFIGURATION DU SPLASH SCREEN - DÉSACTIVÉ
# ============================================
# Le splash natif est désactivé pour aller directement à la vidéo
# flutter_native_splash:
#   color: "#FFFFFF"
#   android: false
#   ios: false
