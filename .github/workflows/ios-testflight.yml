name: iOS TestFlight

# Manuel pour l'instant (Actions > iOS TestFlight > Run workflow).
# Quand les secrets + l'app App Store Connect existent et qu'un 1er build passe,
# tu peux décommenter le bloc `push` pour déployer à chaque push sur main.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['lib/**', 'ios/**', 'pubspec.yaml', '.github/workflows/ios-testflight.yml']

jobs:
  testflight:
    # macos-15 embarque Xcode 26 (SDK iOS 26) requis par App Store Connect depuis 2026
    # ("must be built with the iOS 26 SDK or later"). macos-14 = Xcode 15 (SDK 17.5) -> rejet upload.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Selectionne le Xcode stable le plus recent installe (= 26.x) pour passer le gate SDK iOS 26.
      - name: Select latest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin exact version = local dev + version qui a buildé l'aab v1.2.0+107.
          # 'channel: stable' seul dérive vers le dernier stable (3.44.x) qui casse
          # google_fonts 6.3.0 (FontWeight const key) -> build iOS échoue.
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Génère les artefacts Xcode (Generated.xcconfig) + compile Dart sans signer.
      - name: Flutter build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build & upload to TestFlight (Fastlane)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # NE PAS convertir la cle en SEC1. La cle Apple .p8 est en PKCS#8
          # (BEGIN PRIVATE KEY) : fastlane 2.236.1 (spaceship OpenSSL::PKey.read) la lit
          # tres bien, et SURTOUT altool/Transporter (upload TestFlight) n'accepte QUE le
          # PKCS#8 -> une cle SEC1 donne "Failed to load AuthKey file / has no
          # authentication key". On passe donc ASC_KEY_P8_BASE64 (PKCS#8) tel quel.

          # Cle SSH (deploy key write) pour cloner/pousser le repo certs de fastlane match.
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          gem install fastlane --no-document
          fastlane beta
