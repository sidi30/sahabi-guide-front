name: iOS TestFlight

# Manuel pour l'instant (Actions > iOS TestFlight > Run workflow).
# Quand les secrets + l'app App Store Connect existent et qu'un 1er build passe,
# tu peux décommenter le bloc `push` pour déployer à chaque push sur main.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['lib/**', 'ios/**', 'pubspec.yaml', '.github/workflows/ios-testflight.yml']

jobs:
  testflight:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin exact version = local dev + version qui a buildé l'aab v1.2.0+107.
          # 'channel: stable' seul dérive vers le dernier stable (3.44.x) qui casse
          # google_fonts 6.3.0 (FontWeight const key) -> build iOS échoue.
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Génère les artefacts Xcode (Generated.xcconfig) + compile Dart sans signer.
      - name: Flutter build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build & upload to TestFlight (Fastlane)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # fastlane 2.236.1 -> spaceship token.rb fait OpenSSL::PKey::EC.new(key).
          # Les cles Apple .p8 sont en PKCS#8 (BEGIN PRIVATE KEY) : sous OpenSSL 3
          # EC.new ne sait pas les lire et leve "invalid curve name".
          # On convertit PKCS#8 -> SEC1 (BEGIN EC PRIVATE KEY), format accepte par EC.new,
          # puis on re-passe la cle convertie (base64, une ligne) a fastlane.
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > /tmp/asc_pkcs8.pem
          openssl ec -in /tmp/asc_pkcs8.pem -out /tmp/asc_sec1.pem
          ASC_KEY_P8_BASE64="$(base64 -i /tmp/asc_sec1.pem | tr -d '\n')"
          export ASC_KEY_P8_BASE64

          # Cle SSH (deploy key write) pour cloner/pousser le repo certs de fastlane match.
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          gem install fastlane --no-document
          fastlane beta
